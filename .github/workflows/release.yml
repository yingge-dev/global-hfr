name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build module zip
        run: |
          cd module
          zip -r ../global-hfr.zip .
          cd ..
          unzip -l global-hfr.zip

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: global-hfr.zip
          generate_release_notes: true
