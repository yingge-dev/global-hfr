# 真·全局高刷 · 默认配置 v2
# profile: fixed(固定锁定) / dynamic(动态区间) / off(交还系统)
profile=dynamic

# 固定档位：0 = 自动使用面板最高档
fixed_hz=0

# 动态区间（profile=dynamic 时生效）；dyn_max=0 表示面板最高
dyn_min=60
dyn_max=0

# 动态实现：auto(自动) / native(系统原生) / adaptive(模块自适应)
# auto: 小米且底层锁帧仍生效时自动用 adaptive，其余情况用 native
dyn_engine=auto

# 自适应模式下，静止多久后降到下限（毫秒，>=1000）
dyn_idle_ms=3000

# 触控加速：1 开启 / 0 关闭
touch=1

# 触控等级：standard(标准) / esports(电竞，额外 GPU 与调度 boost)
touch_level=standard

# 全局触控采样率：0/120/240/360/480（需 touch_thp_ic_cmd 节点）
sampling=0

# 深度锁帧：1 = 优先调用 SurfaceFlinger 底层锁定（小米推荐）
deep_lock=1

# 系统原生刷新率浮窗：1 开启 / 0 关闭
overlay=0

# 后台守护：息屏亮屏、配置变更、自适应动态
daemon=1

# 开机自动应用上次配置
auto_boot=1

# 欧加系 LTPO 兼容属性（关闭动态帧率开关），重启后生效
oplus_props=0
